        if (!str) return '';

            .replace(/[أإآ]/g, 'ا') // Seragamkan huruf Alif
            .replace(/ة/g, 'ه') // Seragamkan Ta Marbuthah / Ha
            .replace(/ى/g, 'ي') // Seragamkan Ya
            .replace(/\s+/g, '') // Buang SEMUA jarak (space)
            .replace(/-/g, '') // Buang sengkang
            .trim();
    };
    const normalizeWeek = (w) => {

                        <td className="border border-gray-900 p-2 font-bold bg-gray-100">ستندرد ڤمبلاجرن</td>
                        <td className="border border-gray-900 p-2" colSpan="3">
                          <textarea name="sp" value={erphForm.sp} onChange={handleErphChange} className="w-full bg-transparent resize-none" rows="2" />
                        </td>
                      </tr>
                      <tr>
                        <td className="border border-gray-900 p-2 font-bold bg-gray-100 align-top">
                          <div className="mb-2">اوبجيکتيف ڤمبلاجرن</div>
                          <select onChange={(e) => { handleErphSuggestion('objektif', e.target.value); e.target.value=''; }} className="print:hidden w-full p-1.5 border border-blue-300 rounded bg-blue-50 text-blue-900 font-normal" style={{ fontSize: '0.85em' }}>
                            <option value="">+ چادڠن...</option>
                            {cadanganObjektif.map((cad, i) => <option key={i} value={cad}>{cad}</option>)}
                          </select>
                        </td>
                        <td className="border border-gray-900 p-2" colSpan="3">
                          <textarea name="objektif" value={erphForm.objektif} onChange={handleErphChange} className="w-full bg-transparent resize-none font-semibold" rows="3" />
                        </td>
                      </tr>
                      <tr>
                        <td className="border border-gray-900 p-2 font-bold bg-gray-100 align-top">
                          <div className="mb-2">اکتيۏيتي ڤمبلاجرن</div>
                          <select onChange={(e) => { handleErphSuggestion('aktiviti', e.target.value); e.target.value=''; }} className="print:hidden w-full p-1.5 border border-blue-300 rounded bg-blue-50 text-blue-900 font-normal" style={{ fontSize: '0.85em' }}>
                            <option value="">+ چادڠن...</option>
                            {cadanganAktiviti.map((cad, i) => <option key={i} value={cad}>{cad}</option>)}
                          </select>
                        </td>
                        <td className="border border-gray-900 p-2" colSpan="3">
                          <textarea name="aktiviti" value={erphForm.aktiviti} onChange={handleErphChange} className="w-full bg-transparent resize-none leading-relaxed" rows="5" />
                        </td>
                      </tr>
                      <tr>
                        <td className="border border-gray-900 p-2 font-bold bg-gray-100 align-top">
                          <div className="mb-2">باهن بنتو مڠاجر (BBM)</div>
                          <select onChange={(e) => { handleBbmSuggestion(e.target.value); e.target.value=''; }} className="print:hidden w-full p-1.5 border border-purple-300 rounded bg-purple-50 text-purple-900 font-normal" style={{ fontSize: '0.85em' }}>
                            <option value="">+ چادڠن...</option>
                            {cadanganBBM.map((cad, i) => <option key={i} value={cad}>{cad}</option>)}
                          </select>
                        </td>
                        <td className="border border-gray-900 p-2" colSpan="3">
                          <textarea name="bbm" value={erphForm.bbm} onChange={handleErphChange} className="w-full bg-transparent resize-none font-semibold" rows="2" />
                        </td>
                      </tr>
                    </tbody>
                  </table>

                  <div className="border border-gray-900 p-3 mb-6">
                    <div className="flex justify-between items-center mb-2">
                      <label className="font-bold text-gray-800">ريفليکسي:</label>
                      <select onChange={(e) => { handleErphSuggestion('refleksi', e.target.value); e.target.value=''; }} className="print:hidden w-1/2 md:w-1/3 p-1.5 border border-green-300 rounded bg-green-50 text-green-900 font-normal" style={{ fontSize: '0.9em' }}>
                        <option value="">+ ڤيليه چادڠن ريفليکسي...</option>
                        {cadanganRefleksi.map((cad, i) => <option key={i} value={cad}>{cad}</option>)}
                      </select>
                    </div>
                    <textarea name="refleksi" value={erphForm.refleksi} onChange={handleErphChange} className="w-full bg-transparent resize-none" rows="3" />
                  </div>

                  <div className="grid grid-cols-2 gap-4 mt-8 pt-4 border-t border-gray-400 text-center" style={{ fontSize: '0.9em' }}>
                    <div className="p-2">
                      <div className="font-bold mb-12">دسمق اوليه:</div>
                      <input type="text" name="disemakOleh" value={erphForm.disemakOleh} onChange={handleErphChange} className="w-full bg-transparent border-t border-gray-600 pt-1 font-bold text-center" style={{ fontSize: 'inherit' }} />
                    </div>
                    <div className="p-2">
                      <div className="font-bold mb-12">دصحکن اوليه:</div>
                      <input type="text" name="disahkanOleh" value={erphForm.disahkanOleh} onChange={handleErphChange} className="w-full bg-transparent border-t border-gray-600 pt-1 font-bold text-center" style={{ fontSize: 'inherit' }} />
                    </div>
                  </div>
                </div>

                <div className="mt-8 flex flex-wrap justify-end gap-3 print:hidden border-t pt-6">
                  <button onClick={handleKosongkan} className="text-base bg-red-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-red-700 transition" dir="rtl">كوسوڠكن بورڠ</button>
                  <button onClick={handleSaveToGoogleSheet} className="text-base bg-blue-700 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-800 transition" dir="rtl">سيمڤن ك ݢوݢل شيت</button>
                  <button onClick={handlePrint} className="text-base bg-green-700 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-800 transition" dir="rtl">چيتق / سيمڤن PDF</button>
                </div>
              </div>
            )}

            {}
            {activeTab === 'upload' && (
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 max-w-4xl mx-auto space-y-6" dir="rtl">
                <h3 className="text-xl font-bold text-gray-800 border-b pb-4">موات ناءيق / ايکسترک ار.ڤي.تي</h3>
                <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg flex flex-col justify-between" dir="rtl">
                  <div>
                    <h4 className="font-bold text-blue-900">سݢرقن دري ݢوݢل شيت (Google Sheet)</h4>
                    <p className="text-sm text-blue-800 mt-1">موات تورون سموا ريکود ار.ڤي.تي يڠ تله دسيڤن دالم ݢوݢل شيت اندا.</p>
                  </div>
                  <button onClick={handleGoogleSheetSync} disabled={isSyncingSheet} className="mt-4 bg-blue-700 text-white font-bold px-4 py-2 rounded-lg text-sm w-max hover:bg-blue-800 transition ml-auto">موات تورون داتا سکارڠ</button>
                </div>

                <div className="border border-dashed border-gray-400 p-5 rounded-xl bg-gray-50">
                   <h3 className="text-lg font-bold text-gray-800 mb-4 text-center">ڤروسيس ايکسترک ار.ڤي.تي تمڤتن (2 لڠكه)</h3>
                   
                   <div className="bg-yellow-50 p-4 border border-yellow-200 rounded-lg mb-6 text-center shadow-sm">
                      <div className="inline-block bg-yellow-600 text-white font-bold px-3 py-1 rounded-full text-xs mb-2">لڠكه 1</div>
                      <h4 className="font-bold text-yellow-900 mb-1">موات تورون فايل PDF دري ݢوݢل درايف</h4>
                      <p className="text-sm text-yellow-800 mb-4">سيلا کليک ڤاءوتن دباوه اونتوق موات تورون فايل PDF ار.ڤي.تي كدالم كومڤوتر اندا ترلبيه داهولو.</p>
                      
                      <div className="flex flex-wrap justify-center gap-3">
                        <a href="https://drive.google.com/drive/folders/12K-eWj2660u_6w2L59sQjH_f2rXwM8zB?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي تاج</span>
                        </a>
                        <a href="https://drive.google.com/drive/folders/1CEUxme6JrfpBJKcHlZZDiCCBdpwuwVg2?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي درجه 1</span>
                        </a>
                        <a href="https://drive.google.com/drive/folders/1LUBFrA5jxjSRh8561tk6oWMHijLKz9VP?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي درجه 2</span>
                        </a>
                        <a href="https://drive.google.com/drive/folders/1A6nqqMUl3UR3iGA8zcLSh1wH0CJDRZ7Y?usp=drive_link" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي درجه 3</span>
                        </a>
                        <a href="https://drive.google.com/drive/folders/1eeQ8NrFA7fGUdx9Dxxnt3jFOFwWN4cYW?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي درجه 4</span>
                        </a>
                        <a href="https://drive.google.com/drive/folders/1d8BrSBMiBY-FMamROrXOPpscps43cx4a?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي درجه 5</span>
                        </a>
                        <a href="https://drive.google.com/drive/folders/1vhqc59dXAxjCG4WIE3Kg0gKFS410AF5S?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي درجه 6</span>
                        </a>
                        <a href="https://drive.google.com/drive/folders/1kbYBjaCFiAaCtbNJyGZZuHu2_b3fkdP-?usp=sharing" target="_blank" rel="noopener noreferrer" className="bg-yellow-600 hover:bg-yellow-700 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition shadow-sm">
                          <span>📁 ار.ڤي.تي درجه خاص</span>
                        </a>
                      </div>
                   </div>
                   
                   <form onSubmit={handlePdfUploadProcess} className="bg-white p-5 border border-gray-200 rounded-lg shadow-sm">
                      <div className="text-center mb-4">
                        <div className="inline-block bg-blue-600 text-white font-bold px-3 py-1 rounded-full text-xs mb-2">لڠكه 2</div>
                        <h4 className="font-bold text-gray-800">موات ناءيق دان ايکسترک PDF ك ڤڠکلن داتا</h4>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div dir="rtl">
                          <label className="block text-sm font-bold text-gray-700 mb-1">ڤيليه درجه</label>
                          <select value={uploadForm.darjah} onChange={(e) => setUploadForm({...uploadForm, darjah: e.target.value})} className="w-full p-2 border rounded-lg font-bold bg-gray-50">
                            {listDarjahSAKNJ.map(d => <option key={d} value={d}>{d}</option>)}
                          </select>
                        </div>
                        <div dir="rtl">
                          <label className="block text-sm font-bold text-gray-700 mb-1">ڤيليه سوبجيک ساكنج</label>
                          <select value={uploadForm.mataPelajaran} onChange={(e) => setUploadForm({...uploadForm, mataPelajaran: e.target.value})} className="w-full p-2 border rounded-lg font-bold bg-gray-50 text-green-800">
                            {allSubjectsCombined.map(sub => <option key={sub} value={sub}>{sub}</option>)}
                          </select>
                        </div>
                        <div dir="rtl">
                          <label className="block text-sm font-bold text-gray-700 mb-1">ڤيليه ميڠݢو</label>
                          <select value={uploadForm.minggu} onChange={(e) => setUploadForm({...uploadForm, minggu: e.target.value})} className="w-full p-2 border rounded-lg font-bold bg-gray-50 text-blue-900">
                             {[...Array(43)].map((_, i) => <option key={i+1} value={String(i+1)}>ميڠݢو {i+1}</option>)}
                          </select>
                        </div>
                      </div>
                      
                      <div className="flex flex-col items-center justify-center p-6 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 mb-4 hover:bg-gray-100 transition">
                          <label className="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-bold cursor-pointer transition shadow-md flex items-center gap-2 text-lg">
                            <span>📄 ڤيليه فايل PDF (دري كومڤوتر)</span>
                            <input type="file" accept=".pdf" className="hidden" onChange={handleFileUpload} />
                          </label>
                          <p className="text-xs text-gray-500 mt-3">ڤيليه فايل PDF يڠ تله اندا موات تورون ڤد لڠكه 1</p>
                      </div>

                      <textarea dir="rtl" rows="6" value={uploadForm.rawText} onChange={(e) => setUploadForm({...uploadForm, rawText: e.target.value})} className="w-full p-3 border rounded-lg text-sm bg-gray-50 mb-4" placeholder="تيكس دري PDF اكن دڤاڤركن دسين..." required />
                      
                      <div className="flex justify-end border-t pt-4">
                        <button type="submit" className="bg-green-700 text-white px-8 py-3 rounded-lg font-bold text-lg shadow-md hover:bg-green-800 transition">ڤروسيس دان سيمڤن ك ڤڠکلن داتا</button>
                      </div>
                   </form>
                </div>

                {uploadStatus && <div className="p-4 bg-green-100 border border-green-300 text-green-800 rounded-lg font-bold text-center" dir="rtl">{uploadStatus}</div>}
              </div>
            )}

            {}
            {activeTab === 'database' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100" dir="rtl">
                  <h3 className="text-lg font-bold text-gray-800 mb-4">تمبه ريکود ار.ڤي.تي مانوال</h3>
                  <form onSubmit={saveToDb} className="grid grid-cols-1 md:grid-cols-3 gap-4" dir="rtl">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">درجه / کلس</label>
                      <select name="darjah" value={dbForm.darjah} onChange={handleDbChange} className="w-full p-2 border rounded-lg font-bold" required>
                        {listDarjahSAKNJ.map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">مات ڤلاجرن</label>
                      <select name="mataPelajaran" value={dbForm.mataPelajaran} onChange={handleDbChange} className="w-full p-2 border rounded-lg font-bold text-green-800" required>
                        {allSubjectsCombined.map(sub => <option key={sub} value={sub}>{sub}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">ميڠݢو ک-</label>
                      <select name="minggu" value={dbForm.minggu} onChange={handleDbChange} className="w-full p-2 border rounded-lg font-bold" required>
                         <option value="">ڤيليه ميڠݢو...</option>
                         {[...Array(43)].map((_, i) => <option key={i+1} value={String(i+1)}>ميڠݢو {i+1}</option>)}
                      </select>
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-sm font-bold text-gray-700 mb-1">تاجوق</label>
                      <input type="text" name="tajuk" value={dbForm.tajuk} onChange={handleDbChange} className="w-full p-2 border rounded-lg" required />
                    </div>
                    <div className="md:col-span-3">
                      <label className="block text-sm font-bold text-gray-700 mb-1">ستندرد كاندوڠن (SK)</label>
                      <textarea name="sk" value={dbForm.sk} onChange={handleDbChange} className="w-full p-2 border rounded-lg" rows="2" required />
                    </div>
                    <div className="md:col-span-3">
                      <label className="block text-sm font-bold text-gray-700 mb-1">ستندرد ڤمبلاجرن (SP)</label>
                      <textarea name="sp" value={dbForm.sp} onChange={handleDbChange} className="w-full p-2 border rounded-lg" rows="2" required />
                    </div>
                    <div className="md:col-span-3 flex justify-end pt-2">
                      <button type="submit" className="bg-green-700 text-white px-6 py-2 rounded-lg font-bold">سيمڤن ريکود</button>
                    </div>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100" dir="rtl">
                  <div className="flex flex-wrap justify-between items-center mb-4 gap-4">
                    <h3 className="text-lg font-bold text-gray-800">سناراي ار.ڤي.تي ترسيڤن</h3>
                    <div className="flex gap-2" dir="rtl">
                      <select value={darjahFilter} onChange={(e) => setDarjahFilter(e.target.value)} className="p-2 border rounded-lg font-bold bg-white text-sm">
                        <option value="">سموا درجه</option>
                        {listDarjahSAKNJ.map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                      <select value={subjekFilter} onChange={(e) => setSubjekFilter(e.target.value)} className="p-2 border rounded-lg font-bold bg-white text-sm">
                        <option value="">سموا سوبجيک</option>
                        {allSubjectsCombined.map(sub => <option key={sub} value={sub}>{sub}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="overflow-x-auto" dir="rtl">
                    <table className="w-full text-right border-collapse">
                      <thead>
                        <tr className="bg-gray-50 border-b">
                          <th className="p-3 text-sm font-bold text-gray-600">درجه</th>
                          <th className="p-3 text-sm font-bold text-gray-600">سوبجيک</th>
                          <th className="p-3 text-sm font-bold text-gray-600">ميڠݢو</th>
                          <th className="p-3 text-sm font-bold text-gray-600">تاجوق & SK/SP</th>
                          <th className="p-3 text-sm font-bold text-gray-600 text-center">تيندقن</th>
                        </tr>
                      </thead>
                      <tbody>
                        {rptData
                          .filter(row => (darjahFilter === '' || matchStr(row.darjah) === matchStr(darjahFilter)) && (subjekFilter === '' || matchStr(row.mataPelajaran) === matchStr(subjekFilter)))
                          .sort((a, b) => {
                             if(matchStr(a.darjah) !== matchStr(b.darjah)) return matchStr(a.darjah).localeCompare(matchStr(b.darjah));
                             if(matchStr(a.mataPelajaran) !== matchStr(b.mataPelajaran)) return matchStr(a.mataPelajaran).localeCompare(matchStr(b.mataPelajaran));
                             return parseInt(normalizeWeek(a.minggu)) - parseInt(normalizeWeek(b.minggu));
                          })
                          .map((row) => (
                          <tr key={row.id} className="border-b hover:bg-gray-50">
                            <td className="p-3 align-top font-bold text-green-700">{row.darjah}</td>
                            <td className="p-3 align-top font-bold text-blue-800">{row.mataPelajaran}</td>
                            <td className="p-3 align-top font-bold" dir="ltr">{row.minggu}</td>
                            <td className="p-3 align-top">
                              <div className="font-bold text-green-800">{row.tajuk}</div>
                              <div className="text-sm text-gray-600 mt-1"><strong dir="ltr">SK:</strong> {row.sk}</div>
                              <div className="text-sm text-gray-600 mt-1"><strong dir="ltr">SP:</strong> {row.sp}</div>
                            </td>
                            <td className="p-3 align-top text-center">
                              <button onClick={() => deleteRecord(row.id)} className="text-red-500 hover:text-red-700 p-2 bg-red-50 rounded-full">🗑️</button>
                            </td>
                          </tr>
                        ))}
                        {rptData.length === 0 && (
                          <tr><td colSpan="5" className="text-center p-8 text-gray-500">تيادا ريکود ار.ڤي.تي دجومڤاءي.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<ERPHSystem />, document.getElementById('root'));
  </script>
</body>
</html>
